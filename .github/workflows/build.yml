# Unsigned builds of Compás Tools: an AppImage, an Apple Silicon macOS .dmg and a Windows
# installer. Each bundles compas-sdtool, built here from the player's sources at a pinned ref.
# A `v*` tag also creates a draft GitHub release holding the installers; nothing is published
# automatically (docs/RELEASING.md).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PLAYER_REPO: Starnished66/compas-player
  # The compas-player commit whose sdtool is bundled. Move it to a release tag once there is one.
  PLAYER_REF: e8f88f253068185a2a93b1f3a265744e8dc2f4ab

jobs:
  # compas-sdtool is a C program, so it is built per operating system and passed on as an
  # artifact. Names follow Tauri's sidecar convention: compas-sdtool-<target triple>.
  sdtool:
    name: sdtool (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu }
          - {
              name: windows,
              os: ubuntu-22.04,
              triple: x86_64-pc-windows-msvc,
              make_args: SDTOOL_TARGET=windows,
            }
          - { name: macos-arm64, os: macos-14, triple: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLAYER_REPO }}
          ref: ${{ env.PLAYER_REF }}
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3
          if [ "${{ matrix.name }}" = windows ]; then
            # The Windows binary is a static MinGW-w64 executable, cross-built here.
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          fi
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Build compas-sdtool
        run: |
          if [ "${{ matrix.name }}" = windows ]; then
            make sdtool SDTOOL_TARGET=windows SDTOOL_CMAKE_EXTRA=-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
            echo "SDTOOL_FILE=build_sdtool_windows/compas-sdtool.exe" >> "$GITHUB_ENV"
            echo "SDTOOL_NAME=compas-sdtool-${{ matrix.triple }}.exe" >> "$GITHUB_ENV"
          else
            make sdtool
            echo "SDTOOL_FILE=build_sdtool/compas-sdtool" >> "$GITHUB_ENV"
            echo "SDTOOL_NAME=compas-sdtool-${{ matrix.triple }}" >> "$GITHUB_ENV"
          fi
      - name: Check that it runs and reports its build
        if: matrix.name != 'windows'
        run: |
          mkdir -p card/.compas
          ./${{ env.SDTOOL_FILE }} info card | tee info.json
          grep -q '"build"' info.json
      - run: cp "${{ env.SDTOOL_FILE }}" "${{ env.SDTOOL_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sdtool-${{ matrix.name }}
          path: ${{ env.SDTOOL_NAME }}

  app:
    name: app (${{ matrix.name }})
    needs: sdtool
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            build: npx tauri build --bundles appimage
            bundles: target/release/bundle/appimage/*.AppImage
          - name: macos
            os: macos-14
            build: npx tauri build --target aarch64-apple-darwin --bundles dmg
            bundles: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-2022
            build: npx tauri build --bundles nsis,msi
            bundles: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sdtool-*
          path: ${{ runner.temp }}/sdtool
          merge-multiple: true
      - name: Place the sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "$RUNNER_TEMP"/sdtool/compas-sdtool-* src-tauri/binaries/
          chmod +x src-tauri/binaries/compas-sdtool-* || true
          ls -l src-tauri/binaries

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
      - name: Lint and test
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm test
          scripts/check-file-length.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build the installer (unsigned)
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: compas-tools-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # A draft only: the owner reviews it and publishes it by hand.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: compas-tools-*
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The Windows bundle keeps its nsis/ and msi/ folders; only files go to the release.
          mapfile -t files < <(find installers -type f)
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Compás Tools $TAG" --generate-notes
