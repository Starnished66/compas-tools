# Builds of Compás Tools: a Linux AppImage, an Apple Silicon macOS .dmg and a Windows installer.
# Tag builds are signed for Tauri's updater and create a draft GitHub release.
# A `v*` tag also creates a draft GitHub release holding the installers; nothing is published
# automatically.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYER_REPO: Starnished66/compas-player
  # The compas-player commit compas-sdtool is built against. Move it to a release tag once there is one.
  PLAYER_REF: b20ae6803ebab0e0dd1faea902962c92dcdad203

jobs:
  # compas-sdtool is a C program, so it is built per operating system and passed on as an
  # artifact. Names follow Tauri's sidecar convention: compas-sdtool-<target triple>.
  sdtool:
    name: sdtool (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, dir: sdtool }
          - {
              name: windows,
              os: ubuntu-22.04,
              triple: x86_64-pc-windows-msvc,
              dir: sdtool-windows,
              exe: .exe,
              make_args: 'SDTOOL_TARGET=windows SDTOOL_CMAKE_EXTRA=-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++',
            }
          - { name: macos-arm64, os: macos-14, triple: aarch64-apple-darwin, dir: sdtool }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ env.PLAYER_REPO }}
          ref: ${{ env.PLAYER_REF }}
          path: player
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3
          if [ "${{ matrix.name }}" = windows ]; then
            # The Windows binary is a static MinGW-w64 executable, cross-built here.
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          fi
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      # The player's Makefile first (vendored libraries and flags), then ours; output goes to build/.
      - name: Build compas-sdtool
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          make -C player -j"$jobs" -f Makefile -f "$PWD/sdtool/sdtool.mk" sdtool ${{ matrix.make_args }}
          echo "SDTOOL_FILE=build/${{ matrix.dir }}/compas-sdtool${{ matrix.exe }}" >> "$GITHUB_ENV"
          echo "SDTOOL_NAME=compas-sdtool-${{ matrix.triple }}${{ matrix.exe }}" >> "$GITHUB_ENV"
      - name: Check its build id and database format against the player
        if: matrix.name != 'windows'
        run: scripts/verify-sdtool.sh player "${{ env.SDTOOL_FILE }}"
      # What the installers must carry for the C code inside compas-sdtool: the player's licence
      # texts, flattened into one folder (Tauri bundles it as licenses/sdtool/), and the exact
      # sources it was built from.
      - name: Collect the licence notices of the player sources
        if: matrix.name == 'linux'
        run: |
          mkdir -p sdtool-notices
          cp player/LICENSE sdtool-notices/compas-player-LICENSE.txt
          (cd player && { find licenses -type f; ls third_party/lv_xml/src/libs/expat/LICENSE.txt sonic/LICENSE; }) |
            while read -r f; do cp "player/$f" "sdtool-notices/${f//\//__}"; done
          {
            echo "compas-sdtool is built from the sources of ${{ env.PLAYER_REPO }} at ${{ env.PLAYER_REF }}"
            echo "and from sdtool/ in ${{ github.repository }} at ${{ github.sha }}."
            echo "Both are available from GitHub under those revisions."
          } > sdtool-notices/BUILD_INFO.txt
          ls sdtool-notices
      - name: Keep the notices
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notices-sdtool
          path: sdtool-notices
      - run: cp "${{ env.SDTOOL_FILE }}" "${{ env.SDTOOL_NAME }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdtool-${{ matrix.name }}
          path: ${{ env.SDTOOL_NAME }}

  # The Windows sidecar is cross-built, so run it where it will run: info, build id and
  # database format against the player.
  sdtool-windows-check:
    name: sdtool (windows run)
    needs: sdtool
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ env.PLAYER_REPO }}
          ref: ${{ env.PLAYER_REF }}
          path: player
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdtool-windows
          path: sdtool-exe
      - name: Info, build id and database format
        run: scripts/verify-sdtool.sh player sdtool-exe/compas-sdtool-x86_64-pc-windows-msvc.exe

  app:
    name: app (${{ matrix.name }})
    needs: sdtool
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            build: npx tauri build --bundles appimage
            bundles: |
              target/release/bundle/appimage/*.AppImage
            signatures: target/release/bundle/appimage/*.AppImage.sig
          - name: macos
            os: macos-14
            build: npx tauri build --target aarch64-apple-darwin --bundles dmg
            bundles: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            signatures: target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: windows
            os: windows-2022
            build: npx tauri build --bundles nsis,msi
            bundles: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
            signatures: |
              target/release/bundle/nsis/*.exe.sig
              target/release/bundle/msi/*.msi.sig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sdtool-*
          path: ${{ runner.temp }}/sdtool
          merge-multiple: true
      - name: Place the sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "$RUNNER_TEMP"/sdtool/compas-sdtool-* src-tauri/binaries/
          chmod +x src-tauri/binaries/compas-sdtool-* || true
          ls -l src-tauri/binaries

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notices-sdtool
          path: src-tauri/licenses-sdtool
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '. -> target'

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
      # The licence texts of the Rust crates and npm packages inside the app, bundled with it.
      - name: Generate the third-party notices
        shell: bash
        run: |
          cargo fetch --locked
          node scripts/generate-notices.mjs
      - name: Check the code
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          scripts/check-file-length.sh
          cargo clippy --workspace -- -D warnings

      - name: Build the installer (unsigned, for CI and pull requests)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ${{ matrix.build }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check Apple signing credentials
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          configured=0
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then configured=$((configured + 1)); else missing+=("$name"); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "::notice::Building with an ad-hoc signature. Gatekeeper may require users to approve opening the app manually."
          elif [ "$configured" -ne 6 ]; then
            echo "Apple signing/notarization credentials are incomplete; configure all six Apple secrets or none." >&2
            printf 'Missing: %s\n' "${missing[*]}" >&2
            exit 1
          else
            case "$APPLE_SIGNING_IDENTITY" in
              "Developer ID Application: "*) ;;
              *) echo "APPLE_SIGNING_IDENTITY must name a Developer ID Application identity." >&2; exit 1 ;;
            esac
            echo "APPLE_SIGNING_IDENTITY is configured; Tauri will use it instead of the default ad-hoc identity."
          fi
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required for tagged releases" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for tagged releases" >&2; exit 1; }
      - name: Build the installer (signed updater and macOS package)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          ${{ matrix.build }}
      - name: Check signing secrets
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required for tagged releases" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for tagged releases" >&2; exit 1; }
      - name: Build the signed updater and installer artifacts
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ matrix.build }}
      - name: Verify macOS disk image and updater app signature
        if: runner.os == 'macOS'
        env:
          EXPECT_NOTARIZED: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID != '' && '1' || '0' }}
        shell: bash
        run: |
          dmg=$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            archive=$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)
            bash scripts/verify-macos-package.sh "$dmg" "$archive"
          else
            bash scripts/verify-macos-package.sh "$dmg"
          fi
      # The licence texts must be inside what is distributed, not only in the repository.
      - name: Check the installer carries the licences (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE"/target/release/bundle/appimage/*.AppImage app.AppImage
          chmod +x app.AppImage
          ./app.AppImage --appimage-extract > /dev/null
          for name in LICENSE-GPL-3.0.txt THIRD_PARTY.md THIRD_PARTY_NOTICES.txt NotoSans-OFL.txt Breeze-icons-COPYING.txt BUILD_INFO.txt; do
            find squashfs-root -name "$name" | grep -q . || { echo "$name is missing from the AppImage" >&2; exit 1; }
          done
          find squashfs-root -path '*licenses*' -type f | head -30
      - name: Check the installer carries the licences (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          for name in LICENSE-GPL-3.0.txt THIRD_PARTY.md THIRD_PARTY_NOTICES.txt NotoSans-OFL.txt Breeze-icons-COPYING.txt BUILD_INFO.txt; do
            find "$mount" -name "$name" | grep -q . || { echo "$name is missing from the dmg" >&2; hdiutil detach "$mount" -quiet; exit 1; }
          done
          find "$mount" -path '*licenses*' -type f | head -30
          hdiutil detach "$mount" -quiet
      - name: Check the installers carry the licences (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 7-Zip opens the NSIS installer and lists the notice files under their own names.
          listing=$(7z l -r target/release/bundle/nsis/*.exe)
          for name in LICENSE-GPL-3.0.txt THIRD_PARTY.md THIRD_PARTY_NOTICES.txt NotoSans-OFL.txt Breeze-icons-COPYING.txt BUILD_INFO.txt; do
            grep -q "$name" <<< "$listing" || { echo "$name is missing from the NSIS installer" >&2; echo "$listing" | tail -n 40; exit 1; }
          done
          # The MSI is unpacked with an administrative install into a scratch folder.
          msi=$(ls target/release/bundle/msi/*.msi)
          target=$(cygpath -w "$RUNNER_TEMP/msi-out")
          if msiexec //a "$(cygpath -w "$PWD/$msi")" //qn TARGETDIR="$target" && sleep 5 \
            && [ -n "$(find "$RUNNER_TEMP/msi-out" -type f | head -1)" ]; then
            for name in LICENSE-GPL-3.0.txt THIRD_PARTY.md THIRD_PARTY_NOTICES.txt NotoSans-OFL.txt Breeze-icons-COPYING.txt BUILD_INFO.txt; do
              find "$RUNNER_TEMP/msi-out" -name "$name" | grep -q . || { echo "$name is missing from the MSI" >&2; find "$RUNNER_TEMP/msi-out" -type f | head -40; exit 1; }
            done
          else
            echo "::warning::the MSI could not be unpacked here, so its contents were not checked"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compas-tools-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: compas-tools-signatures-${{ matrix.name }}
          path: ${{ matrix.signatures }}
          if-no-files-found: error

  # A draft only: the owner reviews it and publishes it by hand.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: compas-tools-*
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MACOS_NOTARIZED: ${{ secrets.APPLE_ID != '' }}
        run: |
          # Every platform artifact (including signatures) is required before manifest generation.
          mapfile -t files < <(find installers -type f)
          python3 scripts/create-updater-manifest.py \
            --artifacts installers \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output installers/latest.json
          files+=(installers/latest.json)
          # Checksums cover every installer, updater signature, and the updater manifest.
          : > SHA256SUMS
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> SHA256SUMS; done
          cat SHA256SUMS
          files+=(SHA256SUMS)
          release_flags=(--draft)
          if [[ "$TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          if [[ "$MACOS_NOTARIZED" != true ]]; then release_flags+=(--notes-file docs/MACOS_INSTALL.md); fi
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            "${release_flags[@]}" --verify-tag --title "Compás Tools $TAG" --generate-notes
