# Unsigned builds of Compás Tools: an AppImage, a universal macOS .dmg and a Windows
# installer. Each bundles compas-sdtool, built here from the player's sources at a pinned ref.
# Written for when the repository has a remote; it has not run yet.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PLAYER_REPO: Starnished66/compas-player
  # The compas-player commit whose sdtool is bundled. Move it to a release tag once there is one.
  PLAYER_REF: 2f582c812a5511cae58d3e9af542e6dfb9718b64

jobs:
  # compas-sdtool is a C program, so it is built per operating system and passed on as an
  # artifact. Names follow Tauri's sidecar convention: compas-sdtool-<target triple>.
  sdtool:
    name: sdtool (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu }
          - {
              name: windows,
              os: ubuntu-22.04,
              triple: x86_64-pc-windows-msvc,
              make_args: SDTOOL_TARGET=windows,
            }
          - { name: macos-x64, os: macos-15-intel, triple: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-14, triple: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLAYER_REPO }}
          ref: ${{ env.PLAYER_REF }}
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3
          if [ "${{ matrix.name }}" = windows ]; then
            # The Windows binary is a static MinGW-w64 executable, cross-built here.
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          fi
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Build compas-sdtool
        run: |
          if [ "${{ matrix.name }}" = windows ]; then
            make sdtool SDTOOL_TARGET=windows SDTOOL_CMAKE_EXTRA=-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
            echo "SDTOOL_FILE=build_sdtool_windows/compas-sdtool.exe" >> "$GITHUB_ENV"
            echo "SDTOOL_NAME=compas-sdtool-${{ matrix.triple }}.exe" >> "$GITHUB_ENV"
          else
            make sdtool
            echo "SDTOOL_FILE=build_sdtool/compas-sdtool" >> "$GITHUB_ENV"
            echo "SDTOOL_NAME=compas-sdtool-${{ matrix.triple }}" >> "$GITHUB_ENV"
          fi
      - name: Check that it runs and reports its build
        if: matrix.name != 'windows'
        run: |
          mkdir -p card/.compas
          ./${{ env.SDTOOL_FILE }} info card | tee info.json
          grep -q '"build"' info.json
      - run: cp "${{ env.SDTOOL_FILE }}" "${{ env.SDTOOL_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sdtool-${{ matrix.name }}
          path: ${{ env.SDTOOL_NAME }}

  app:
    name: app (${{ matrix.name }})
    needs: sdtool
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            build: npx tauri build --bundles appimage
            bundles: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos
            os: macos-14
            build: npx tauri build --target universal-apple-darwin --bundles dmg
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-2022
            build: npx tauri build --bundles nsis,msi
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sdtool-*
          path: sdtool
          merge-multiple: true
      - name: Place the sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp sdtool/compas-sdtool-* src-tauri/binaries/
          chmod +x src-tauri/binaries/compas-sdtool-* || true
          if [ "${{ matrix.name }}" = macos ]; then
            # A universal app needs the two architectures joined into one sidecar.
            lipo -create src-tauri/binaries/compas-sdtool-x86_64-apple-darwin \
                         src-tauri/binaries/compas-sdtool-aarch64-apple-darwin \
                 -output src-tauri/binaries/compas-sdtool-universal-apple-darwin
          fi
          ls -l src-tauri/binaries

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
      - name: Lint and test
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm test
          scripts/check-file-length.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build the installer (unsigned)
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: compas-tools-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
